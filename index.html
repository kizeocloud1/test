<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 THM KZ</title>
    <script>
        /* ── DETECCION PS3 (antes de cualquier render) ────────────── */
        var isPS3 = /PS3|PlayStation 3|NetFront/i.test(navigator.userAgent)
                 || window.location.search.indexOf('mode=ps3') > -1;

        /* Detectar ratio de pantalla para 4:3 en PS3 */
        var is43 = false;
        if (isPS3) {
            try {
                /* 4:3 si el ratio es <= 1.40 (ej. 1024x768, 640x480) */
                var _r = screen.width / screen.height;
                is43 = (_r <= 1.40);
            } catch(e) {}
        }

        /* Clases en <html> desde el principio para que el CSS las use */
        document.documentElement.className =
            (isPS3 ? 'is-ps3' : 'is-pc') + (is43 ? ' is-43' : '');
    </script>
    <style>
        /* ── RESET ────────────────────────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background: #0b0f17;
            color: #e0e5f0;
            font-family: Arial, sans-serif;
            line-height: 1.2;
            padding: 20px 0;
            text-align: center;
        }

        /* ── CONTENEDOR PRINCIPAL ─────────────────────────────────── */
        /*
         * PC / PS3 16:9  → 1750px ancho
         * PS3 4:3         → 100% del viewport
         */
        .main-container {
            width: 1750px;
            margin: 0 auto;
            text-align: left;
        }

        /* 4:3: contenedor fluido, sin scroll horizontal */
        .is-43 body {
            padding: 8px 0;
            overflow-x: hidden;
        }
        .is-43 .main-container {
            width: 100%;
            min-width: 0;
            padding: 0 8px;
        }

        /* PS3 general: sin animaciones para ahorrar CPU */
        .is-ps3 * {
            -webkit-transition: none !important;
            transition: none !important;
            -webkit-animation: none !important;
            animation: none !important;
        }

        /* ── HEADER ───────────────────────────────────────────────── */
        .header {
            overflow: hidden;
            margin-bottom: 25px;
            border-bottom: 5px solid #ff6b35;
            padding-bottom: 20px;
            text-align: center;
        }

        .logo-img {
            height: 115px;
            float: left;
            cursor: pointer;
        }

        .social-container {
            float: right;
            background: #0a1a2a;
            padding: 10px 30px;
            border-radius: 60px;
            border: 3px solid #ff6b35;
            margin-top: 15px;
        }

        .social-icon {
            width: 62px;
            height: 62px;
            margin: 0 7px;
            vertical-align: middle;
        }

        /* 4:3: header más compacto */
        .is-43 .logo-img      { height: 70px; }
        .is-43 .social-icon   { width: 42px; height: 42px; margin: 0 4px; }
        .is-43 .social-container {
            padding: 6px 14px;
            border-radius: 40px;
            margin-top: 8px;
        }
        .is-43 .header        { margin-bottom: 10px; padding-bottom: 10px; }

        /* Ocultar el banner de créditos en 4:3 para ganar espacio */
        .is-43 .credits-banner { display: none; }

        /* ── TOOLBAR ──────────────────────────────────────────────── */
        .toolbar {
            display: table;
            width: 100%;
            background: #0a1a2a;
            padding: 15px 25px;
            border-radius: 60px;
            margin-bottom: 25px;
            border-left: 6px solid #ff6b35;
            height: 86px;
            box-sizing: border-box;
        }

        .toolbar-left, .toolbar-right {
            display: table-cell;
            vertical-align: middle;
        }

        .toolbar-right { text-align: right; }

        .search-wrapper {
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        .search-wrapper input {
            width: 310px;
            height: 50px;
            padding: 0 22px;
            background: #0b1a2a;
            border: 2px solid #1e3b4f;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            vertical-align: middle;
        }

        .btn-aleatorio {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 0 20px;
            border-radius: 40px;
            height: 50px;
            line-height: 50px;
            font-size: 14px;
            border: 2px solid #ff6b35;
            vertical-align: middle;
            cursor: pointer;
            margin-left: 10px;
            text-transform: uppercase;
        }

        .sort-buttons {
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        .sort-btn {
            height: 50px;
            background: #1e3b4f;
            border: 2px solid #1e3b4f;
            color: #c9d9e8;
            padding: 0 22px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 7px;
            font-size: 15px;
            vertical-align: middle;
            line-height: 46px;
        }

        .credits-banner {
            height: 42px;
            display: inline-block;
            margin-top: 73px;
            margin-bottom: -20px;
            vertical-align: bottom;
        }

        .stats {
            display: inline-block;
            vertical-align: middle;
            color: #9ab8d9;
            font-weight: bold;
            font-size: 18px;
            margin-right: 20px;
        }

        .btn-pkg {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 0 25px;
            border-radius: 40px;
            height: 50px;
            line-height: 50px;
            font-size: 16px;
            border: 2px solid #ff6b35;
            vertical-align: middle;
        }

        .sort-btn.active       { background: #ff6b35; color: #0b0f17; border-color: #ff6b35; }
        .btn-genre-active      { background: #0b1a2a; border-color: #ffb28c; color: #ffb28c; display: none; }
        .btn-adult             { border-color: #ff3535; color: #ff9b9b; }
        .btn-adult.active      { background: #ff3535; color: white; }

        /* 4:3: toolbar apilada verticalmente */
        .is-43 .toolbar {
            display: block;
            height: auto;
            padding: 8px 10px;
            border-radius: 18px;
            margin-bottom: 10px;
        }
        .is-43 .toolbar-left,
        .is-43 .toolbar-right  { display: block; text-align: left; }
        .is-43 .toolbar-right  { margin-top: 6px; text-align: left; }
        .is-43 .search-wrapper input { width: 170px; height: 38px; font-size: 13px; padding: 0 10px; }
        .is-43 .btn-aleatorio  { height: 38px; line-height: 38px; font-size: 12px; padding: 0 12px; margin-left: 5px; }
        .is-43 .sort-btn       { height: 38px; line-height: 34px; font-size: 12px; padding: 0 10px; margin-right: 4px; }
        .is-43 .btn-pkg        { height: 38px; line-height: 38px; font-size: 13px; padding: 0 14px; }
        .is-43 .stats          { font-size: 13px; margin-right: 8px; }

        /* ── LAYOUT SIDEBAR + GRID ────────────────────────────────── */
        .body-layout {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .sidebar-cell {
            display: table-cell;
            width: 220px;
            vertical-align: top;
            padding-right: 18px;
        }

        .content-cell { display: table-cell; vertical-align: top; }

        /* 4:3: sidebar más estrecho, tamaño de fuente reducido */
        .is-43 .sidebar-cell   { width: 130px; padding-right: 8px; }

        /* ── SIDEBAR ──────────────────────────────────────────────── */
        .genre-sidebar {
            background: #0a1a2a;
            border-radius: 18px;
            border: 2px solid #1e3b4f;
            border-left: 5px solid #ff6b35;
            overflow: hidden;
        }

        .sidebar-title {
            background: #ff6b35;
            color: #0b0f17;
            font-weight: bold;
            font-size: 15px;
            padding: 13px 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .genre-list { overflow: visible; }

        .genre-item {
            display: block;
            width: 100%;
            padding: 11px 16px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #0f2030;
            color: #b0c8e0;
            font-size: 14px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            text-decoration: none;
        }

        .genre-item.active {
            background: #1e3b4f;
            color: #ff6b35;
            border-left: 4px solid #ff6b35;
            padding-left: 12px;
        }

        .todos-count {
            float: right;
            background: #0b1a2a;
            color: #5a7a90;
            font-size: 12px;
            padding: 2px 7px;
            border-radius: 8px;
            font-weight: normal;
        }

        .genre-item.active .todos-count { background: #ff6b3530; color: #ffb28c; }

        /* 4:3: sidebar compacto */
        .is-43 .sidebar-title  { font-size: 12px; padding: 8px 8px; letter-spacing: 0; }
        .is-43 .genre-item     { font-size: 11px; padding: 7px 8px; }
        .is-43 .todos-count    { font-size: 10px; display: none; } /* ocultar contadores para ahorrar espacio */

        /* ── GRID ─────────────────────────────────────────────────── */
        .grid {
            text-align: center;
            min-height: 600px;
        }

        .theme-card {
            width: 350px;
            background: #0e1727;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #1f3a4c;
            display: inline-block;
            vertical-align: top;
            margin: 12px;
            text-align: left;
        }

        .preview {
            width: 100%;
            background: #000;
            text-align: center;
            border-bottom: 3px solid #ff6b35;
            height: 225px;
            line-height: 225px;
            overflow: hidden;
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;
            vertical-align: middle;
        }

        .card-info    { padding: 20px; }

        .theme-name {
            font-weight: bold;
            font-size: 19px;
            color: #fff;
            height: 45px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .theme-genre {
            background: #1e3b4f;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #ffb28c;
            margin-bottom: 15px;
            display: inline-block;
            border: 1px solid #ff6b35;
            cursor: pointer;
        }

        .download-btn {
            background: #ff6b35;
            color: #0b0f17;
            text-decoration: none;
            font-weight: bold;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            display: block;
            font-size: 15px;
        }

        /*
         * 4:3: tarjetas más pequeñas para que quepan 2 por fila.
         * El ancho disponible en 4:3 (ej. 1024px) menos sidebar (130px)
         * y márgenes queda ~860px → 2 tarjetas de ~400px sin problema.
         * Se usa width relativo para que escale con el viewport.
         */
        .is-43 .theme-card    { width: 46%; margin: 6px 1.5%; border-radius: 12px; }
        .is-43 .preview       { height: 140px; line-height: 140px; }
        .is-43 .card-info     { padding: 10px; }
        .is-43 .theme-name    { font-size: 13px; height: 32px; margin-bottom: 5px; }
        .is-43 .theme-genre   { font-size: 11px; padding: 3px 7px; margin-bottom: 8px; }
        .is-43 .download-btn  { font-size: 12px; padding: 8px; border-radius: 30px; }
        .is-43 .grid          { min-height: 300px; }

        /* ── PAGINACION ───────────────────────────────────────────── */
        .pagination-container { text-align: center; margin: 40px 0; }

        .page-box {
            display: inline-block;
            width: 50px;
            height: 50px;
            line-height: 46px;
            background: #1e3b4f;
            border: 2px solid #1e3b4f;
            color: #fff;
            margin: 0 4px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            vertical-align: middle;
        }

        .page-box.active { background: #ff6b35; border-color: #ff6b35; color: #0b0f17; }

        .is-43 .page-box      { width: 36px; height: 36px; line-height: 32px; font-size: 13px; margin: 0 2px; }
        .is-43 .pagination-container { margin: 20px 0; }

        /* ── FOOTER ───────────────────────────────────────────────── */
        .footer {
            margin-top: 50px;
            border-top: 3px solid #ff6b3540;
            padding: 25px 0;
            color: #b0c8e0;
            font-size: 16px;
        }

        .is-43 .footer        { margin-top: 20px; padding: 12px 0; font-size: 12px; }

        .clearfix::after { content: ""; display: table; clear: both; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header clearfix">
        <img src="recursos/titulo.png" alt="Logo" class="logo-img" onclick="volverInicio()">
        <img src="recursos/credits.png" class="credits-banner">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos"><img src="recursos/yt.png" class="social-icon" width="62" height="62"></a>
            <a href="https://github.com/kizeo0"><img src="recursos/git.png" class="social-icon" width="62" height="62"></a>
            <a href="https://x.com/KiZeo0"><img src="recursos/x.png" class="social-icon" width="62" height="62"></a>
        </div>
    </div>

    <div class="toolbar">
        <div class="toolbar-left">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="buscarConRetraso()">
                <button class="btn-aleatorio" onclick="modoAleatorio()">Aleatorio</button>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn btn-adult" id="adultBtn" onclick="toggleAdulto()">+18 OFF</button>
                <button class="sort-btn btn-genre-active" id="genreActiveBtn" onclick="volverInicio()"></button>

        </div>

    <div class="body-layout">

            <div class="genre-sidebar">
                <div class="sidebar-title">Generos</div>
                <div class="genre-list" id="genreList">
                    <div style="padding:16px;color:#5a7a90;font-size:13px;">Cargando...</div>
                </div>
            </div>
        </div>
        <div class="content-cell">
            <div id="themeGrid" class="grid">
                <div style="padding:40px;color:#ffb28c;">Cargando base de datos...</div>
            </div>
            <div class="pagination-container" id="pagination"></div>
        </div>
    </div>

    <div class="footer clearfix">
        <span style="float:left">&#169; PS3 THM KZ</span>
        <span style="float:right">Youtube KiZeo</span>

</div>

<script>
    /* ══════════════════════════════════════════════════════════════
       CONFIGURACION
       ══════════════════════════════════════════════════════════════ */
    var JSON_URL     = 'temas_ps3_conlinks.json';

    /*
     * En PS3 limitamos el PAGE_SIZE y la carga paralela para no
     * saturar la memoria del navegador NetFront.
     * En 4:3 mostramos menos tarjetas por página (caben 2 por fila).
     */
    var PAGE_SIZE    = isPS3 ? (is43 ? 6 : 8) : 12;
    var CHUNK_SIZE   = isPS3 ? 150 : 400;   /* items por tick */
    var IMG_PARALLEL = isPS3 ? 1   : 2;     /* imagenes simultáneas */
    var SEARCH_DELAY = isPS3 ? 800 : 600;   /* debounce buscador (ms) */

    var ADULTO_KEYS = ['adult','18+','girls/adult','sexy','ecchi','hentai',
                       'babes','harem','j-idols','j-idol','girl','girls'];

    /* GIF 1x1 transparente: placeholder sin petición de red */
    var G_EMPTY = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

    var BASE = 'https://raw.githubusercontent.com/kizeocloud1/Previews-compresed/main/';
    var FOLDERS = [
        BASE+'previews1/', BASE+'previews2/', BASE+'previews3/',
        BASE+'previews4/', BASE+'previews5/', BASE+'previews6/'
    ];

    /* ══════════════════════════════════════════════════════════════
       ESTADO GLOBAL
       ══════════════════════════════════════════════════════════════ */
    var allThemes      = [];
    var genresCache    = [];
    var filteredThemes = [];
    var currentPage    = 0;
    var currentGenre   = '';
    var mostrarAdulto  = false;
    var esModoAleatorio = false;
    var searchTimer    = null;
    var chunkTimer     = null;   /* control del setTimeout de procesarChunk */
    var imageQueue     = [];
    var imgActivos     = 0;
    var imgTimer       = null;   /* control del setTimeout de procesarColaImagenes */

    /* ── Referencias DOM (una sola vez) ──────────────────────────── */
    var grid        = document.getElementById('themeGrid');
    var statsDiv    = document.getElementById('stats');
    var pagDiv      = document.getElementById('pagination');
    var searchInput = document.getElementById('searchInput');
    var genreList   = document.getElementById('genreList');
    var genreBtn    = document.getElementById('genreActiveBtn');

    /* ══════════════════════════════════════════════════════════════
       UTILIDADES
       ══════════════════════════════════════════════════════════════ */
    function trim(s) { return s.replace(/^\s+|\s+$/g, ''); }

    function calcIsAdult(gen) {
        var g = gen.toLowerCase();
        for (var i = 0; i < ADULTO_KEYS.length; i++) {
            if (g.indexOf(ADULTO_KEYS[i]) !== -1) return true;
        }
        return false;
    }

    /* Cancelar cola de imágenes y timers pendientes */
    function cancelarColas() {
        imageQueue = [];
        imgActivos = 0;
        if (imgTimer)   { clearTimeout(imgTimer);   imgTimer   = null; }
        if (chunkTimer) { clearTimeout(chunkTimer); chunkTimer = null; }
        if (searchTimer){ clearTimeout(searchTimer); searchTimer = null; }
    }

    /* ══════════════════════════════════════════════════════════════
       CARGA DEL JSON
       ══════════════════════════════════════════════════════════════ */
    function cargarJSON() {
        var xhr = new XMLHttpRequest();
        /* cache-buster solo en PC para no desperdiciar ancho de banda en PS3 */
        var url = isPS3 ? JSON_URL : (JSON_URL + '?t=' + (new Date().getTime()));
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status === 200 || xhr.status === 0) {
                var raw;
                try { raw = JSON.parse(xhr.responseText); }
                catch(e) {
                    grid.innerHTML = '<div style="color:red">Error: JSON invalido.</div>';
                    xhr = null;
                    return;
                }
                xhr = null; /* liberar referencia XHR inmediatamente */
                procesarChunk(raw, 0);
            } else {
                grid.innerHTML = '<div style="color:red">Error al cargar JSON (' + xhr.status + ').</div>';
                xhr = null;
            }
        };
        xhr.send(null);
    }

    /*
     * Procesa el array JSON en bloques de CHUNK_SIZE usando setTimeout
     * para ceder el hilo entre chunks y evitar congelamiento.
     * El timer se guarda en chunkTimer para poder cancelarlo si hace falta.
     */
    function procesarChunk(raw, offset) {
        var fin = Math.min(offset + CHUNK_SIZE, raw.length);

        for (var i = offset; i < fin; i++) {
            var item   = raw[i];
            var nombre = item.archivo.replace(/\.p3t$/i, '');
            var genero = item.genero || 'Otro';
            allThemes.push({
                descarga:    item.descarga,
                genero:      genero,
                nombre:      nombre,
                nombreLower: nombre.toLowerCase(),
                generoLower: genero.toLowerCase(),
                isAdult:     calcIsAdult(genero),
                imgName:     encodeURIComponent(nombre + '.png').replace(/'/g, '%27'),
                safeGenre:   genero.replace(/'/g, '&#39;'),
                preview_idx: item.preview_idx || 0
            });
        }

        grid.innerHTML = '<div style="padding:40px;color:#ffb28c;">Cargando... '
                         + fin + ' / ' + raw.length + '</div>';

        if (fin < raw.length) {
            chunkTimer = setTimeout(function() {
                chunkTimer = null;
                procesarChunk(raw, fin);
            }, isPS3 ? 40 : 20);
        } else {
            raw = null; /* liberar array JSON crudo */
            construirCacheGeneros();
            construirSidebar();
            aplicarFiltros();
        }
    }

    /* ══════════════════════════════════════════════════════════════
       CACHE DE GENEROS
       ══════════════════════════════════════════════════════════════ */
    function construirCacheGeneros() {
        var seen   = {};
        var result = [];
        for (var i = 0; i < allThemes.length; i++) {
            var g = allThemes[i].genero;
            if (!seen[g] && (!allThemes[i].isAdult || mostrarAdulto)) {
                seen[g]  = true;
                result.push(g);
            }
        }
        result.sort(function(a, b) { return a < b ? -1 : a > b ? 1 : 0; });
        genresCache = result;
        seen = null;
    }

    /* ══════════════════════════════════════════════════════════════
       SIDEBAR
       ══════════════════════════════════════════════════════════════ */
    function construirSidebar() {
        var total = 0;
        for (var i = 0; i < allThemes.length; i++) {
            if (!allThemes[i].isAdult || mostrarAdulto) total++;
        }

        var parts = [];
        var activeTodos = (currentGenre === '') ? ' active' : '';
        parts.push('<button class="genre-item' + activeTodos + '" id="genre-btn-todos" onclick="volverInicio()">');
        parts.push('Todos <span class="todos-count">' + total + '</span></button>');

        for (var j = 0; j < genresCache.length; j++) {
            var gn      = genresCache[j];
            var activeG = (gn === currentGenre) ? ' active' : '';
            var safeG   = gn.replace(/'/g, '&#39;');
            parts.push('<button class="genre-item' + activeG + '" onclick="filtrarPorGenero(\'' + safeG + '\')">' + gn + '</button>');
        }

        genreList.innerHTML = parts.join('');
        parts = null;
    }

    function actualizarSidebarActivo() {
        var items = genreList.getElementsByTagName('button');
        for (var i = 0; i < items.length; i++) {
            var btn  = items[i];
            var span = btn.getElementsByTagName('span');
            var label = span.length > 0
                ? btn.innerHTML.replace(span[0].outerHTML, '')
                : btn.innerHTML;
            label = trim(label);
            var isActive = (currentGenre === '' && label === 'Todos') ||
                           (currentGenre !== '' && label === currentGenre);
            btn.className = isActive ? 'genre-item active' : 'genre-item';
        }
    }

    /* ══════════════════════════════════════════════════════════════
       FILTRADO
       ══════════════════════════════════════════════════════════════ */
    window.buscarConRetraso = function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
            searchTimer     = null;
            currentGenre    = '';
            currentPage     = 0;
            esModoAleatorio = false;
            actualizarSidebarActivo();
            aplicarFiltros();
        }, SEARCH_DELAY);
    };

    function aplicarFiltros() {
        var query      = trim(searchInput.value).toLowerCase();
        var hayQuery   = query !== '';
        var hayGenre   = currentGenre !== '';
        var genreLower = currentGenre.toLowerCase();
        filteredThemes = [];

        if (hayGenre) {
            genreBtn.style.display = 'inline-block';
            genreBtn.innerHTML     = currentGenre + ' X';
        } else {
            genreBtn.style.display = 'none';
        }

        for (var i = 0; i < allThemes.length; i++) {
            var t = allThemes[i];
            if (!mostrarAdulto && t.isAdult)                       continue;
            if (hayQuery  && t.nombreLower.indexOf(query) === -1)  continue;
            if (hayGenre  && t.generoLower !== genreLower)         continue;
            filteredThemes.push(t);
        }
        render();
    }

    /* ══════════════════════════════════════════════════════════════
       RENDERIZADO
       ══════════════════════════════════════════════════════════════ */
    function crearTarjeta(t, id, destacado) {
        var extra  = destacado ? ' style="border-color:#ffb28c;"' : '';
        var folder = FOLDERS[t.preview_idx] || FOLDERS[0];
        imageQueue.push({ id: 'img_' + id, src: folder + t.imgName, name: t.imgName, idx: t.preview_idx });

        return '<div class="theme-card"' + extra + '>'
             + '<div class="preview"><img src="' + G_EMPTY + '" id="img_' + id + '" width="350" height="225"></div>'
             + '<div class="card-info">'
             + '<div class="theme-name">' + t.nombre + '</div>'
             + '<div class="theme-genre" onclick="filtrarPorGenero(\'' + t.safeGenre + '\')">' + t.genero + '</div>'
             + '<a href="' + t.descarga + '" class="download-btn">DESCARGAR</a>'
             + '</div></div>';
    }

    function render() {
        cancelarColas();

        var parts = [];

        /* Tarjetas destacadas (AnimugenZ) solo en portada */
        if (!esModoAleatorio && currentPage === 0 && !currentGenre && !trim(searchInput.value)) {
            var n = 0;
            for (var k = 0; k < allThemes.length && n < 2; k++) {
                if (allThemes[k].genero === 'AnimugenZ') {
                    parts.push(crearTarjeta(allThemes[k], 'dest_' + n, true));
                    n++;
                }
            }
        }

        var start = currentPage * PAGE_SIZE;
        var end   = Math.min(start + PAGE_SIZE, filteredThemes.length);
        for (var i = start; i < end; i++) {
            parts.push(crearTarjeta(filteredThemes[i], i, false));
        }

        grid.innerHTML   = parts.length
            ? parts.join('')
            : '<div style="padding:40px;">No se encontraron resultados.</div>';
        statsDiv.innerHTML = filteredThemes.length + ' Temas';
        parts = null;

        dibujarPaginacion();

        /*
         * Retrasar la carga de imágenes para que el navegador
         * termine de pintar el DOM antes de lanzar peticiones de red.
         * En PS3 el delay es mayor para darle más tiempo al motor.
         */
        imgTimer = setTimeout(procesarColaImagenes, isPS3 ? 200 : 80);
    }

    /* ══════════════════════════════════════════════════════════════
       PAGINACION
       ══════════════════════════════════════════════════════════════ */
    function dibujarPaginacion() {
        var total  = Math.ceil(filteredThemes.length / PAGE_SIZE);
        pagDiv.innerHTML = '';
        if (total <= 1) return;

        var startP = Math.max(0, currentPage - 4);
        var endP   = Math.min(total - 1, startP + 9);

        for (var p = startP; p <= endP; p++) {
            var btn       = document.createElement('button');
            btn.className = (p === currentPage) ? 'page-box active' : 'page-box';
            btn.innerHTML = p + 1;
            btn.onclick   = (function(pg) {
                return function() {
                    currentPage = pg;
                    render();
                    /* Scroll hacia arriba al cambiar página */
                    window.scrollTo(0, 0);
                };
            })(p);
            pagDiv.appendChild(btn);
        }
    }

    /* ══════════════════════════════════════════════════════════════
       COLA DE IMAGENES — carga paralela limitada
       ══════════════════════════════════════════════════════════════ */
    function procesarColaImagenes() {
        imgTimer = null;
        while (imageQueue.length > 0 && imgActivos < IMG_PARALLEL) {
            var item  = imageQueue.shift();
            var imgEl = document.getElementById(item.id);
            if (!imgEl) { continue; }
            imgActivos++;
            (function(el, it) {
                el.onload = function() {
                    el.onload = null; el.onerror = null;
                    imgActivos--;
                    /* pequeño delay entre cargas para no saturar la red/CPU de PS3 */
                    if (isPS3) {
                        imgTimer = setTimeout(procesarColaImagenes, 60);
                    } else {
                        procesarColaImagenes();
                    }
                };
                el.onerror = function() {
                    el.onload = null; el.onerror = null;
                    proximaCarpeta(el, it.idx, it.name);
                };
                el.src = it.src;
            })(imgEl, item);
        }
    }

    window.proximaCarpeta = function(img, idx, name) {
        var nIdx = idx + 1;
        if (nIdx < FOLDERS.length) {
            img.onerror = function() {
                img.onload = null; img.onerror = null;
                proximaCarpeta(img, nIdx, name);
            };
            img.onload = function() {
                img.onload = null; img.onerror = null;
                imgActivos--;
                if (isPS3) {
                    imgTimer = setTimeout(procesarColaImagenes, 60);
                } else {
                    procesarColaImagenes();
                }
            };
            img.src = FOLDERS[nIdx] + name;
        } else {
            img.style.display = 'none';
            imgActivos--;
            procesarColaImagenes();
        }
    };

    /* ══════════════════════════════════════════════════════════════
       ACCIONES
       ══════════════════════════════════════════════════════════════ */
    window.modoAleatorio = function() {
        esModoAleatorio = true;
        /* Fisher-Yates shuffle */
        for (var i = filteredThemes.length - 1; i > 0; i--) {
            var j   = Math.floor(Math.random() * (i + 1));
            var tmp = filteredThemes[i];
            filteredThemes[i] = filteredThemes[j];
            filteredThemes[j] = tmp;
        }
        currentPage = 0;
        render();
    };

    window.toggleAdulto = function() {
        mostrarAdulto = !mostrarAdulto;
        var btn = document.getElementById('adultBtn');
        btn.innerHTML = mostrarAdulto ? '+18 ON' : '+18 OFF';
        btn.className = mostrarAdulto ? 'sort-btn btn-adult active' : 'sort-btn btn-adult';
        if (!mostrarAdulto && currentGenre !== '') {
            for (var i = 0; i < allThemes.length; i++) {
                if (allThemes[i].genero === currentGenre && allThemes[i].isAdult) {
                    currentGenre = '';
                    break;
                }
            }
        }
        currentPage = 0;
        construirCacheGeneros();
        construirSidebar();
        aplicarFiltros();
    };

    window.filtrarPorGenero = function(g) {
        currentGenre        = g;
        searchInput.value   = '';
        currentPage         = 0;
        actualizarSidebarActivo();
        aplicarFiltros();
    };

    window.volverInicio = function() {
        searchInput.value   = '';
        currentGenre        = '';
        currentPage         = 0;
        esModoAleatorio     = false;
        actualizarSidebarActivo();
        aplicarFiltros();
    };

    /* ══════════════════════════════════════════════════════════════
       LIMPIEZA DE MEMORIA AL SALIR
       ——————————————————————————————————————————————————————————————
       Crítico en PS3: limpiar todos los timers, colas y referencias
       grandes ANTES de que el navegador descargue la página.
       Esto previene que NetFront deje estado corrupto en RAM que
       afecte al HEN tras reiniciar.
       ══════════════════════════════════════════════════════════════ */
    window.onbeforeunload = function() {
        /* 1. Cancelar todos los timers activos */
        cancelarColas();

        /* 2. Limpiar el DOM para liberar nodos */
        if (grid) grid.innerHTML      = '';
        if (pagDiv) pagDiv.innerHTML  = '';
        if (genreList) genreList.innerHTML = '';

        /* 3. Anular arrays grandes */
        if (allThemes)      { allThemes.length      = 0; allThemes      = null; }
        if (filteredThemes) { filteredThemes.length  = 0; filteredThemes = null; }
        if (genresCache)    { genresCache.length     = 0; genresCache    = null; }
        if (imageQueue)     { imageQueue.length      = 0; imageQueue     = null; }

        /* 4. Anular referencias DOM */
        grid = pagDiv = statsDiv = searchInput = genreList = genreBtn = null;
    };

    /* ══════════════════════════════════════════════════════════════
       ARRANQUE
       — Dar tiempo al navegador para pintar el HTML antes de
         lanzar la petición XHR (especialmente importante en PS3).
       ══════════════════════════════════════════════════════════════ */
    setTimeout(cargarJSON, isPS3 ? 800 : 500);
</script>
</body>
</html>

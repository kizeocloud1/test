<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 THM KZ - Optimized</title>
    <style>
        /* Optimizacion de renderizado base */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: #0b0f17; color: #e0e5f0; font-family: Arial, sans-serif; line-height: 1.2; padding: 10px 0; text-align: center; }

        /* Contenedor fluido para 4:3 y 16:9 */
        .main-container { width: 96%; max-width: 1700px; margin: 0 auto; text-align: left; }

        /* Header Adaptativo */
        .header { overflow: hidden; margin-bottom: 20px; border-bottom: 5px solid #ff6b35; padding-bottom: 15px; text-align: center; }
        .logo-img { height: 90px; max-width: 100%; cursor: pointer; display: inline-block; }

        .social-container { display: inline-block; background: #0a1a2a; padding: 5px 15px; border-radius: 40px; border: 2px solid #ff6b35; margin-top: 10px; vertical-align: middle; }
        .social-icon { width: 45px; height: 45px; margin: 0 5px; vertical-align: middle; }

        /* Toolbar Optimizada */
        .toolbar { background: #0a1a2a; padding: 10px; border-radius: 15px; margin-bottom: 20px; border-left: 6px solid #ff6b35; min-height: 60px; text-align: center; }
        .toolbar-left, .toolbar-right { display: inline-block; vertical-align: middle; width: 100%; max-width: 100%; }
        
        .search-wrapper { margin: 5px; display: inline-block; }
        .search-wrapper input { width: 200px; height: 40px; padding: 0 15px; background: #0b1a2a; border: 2px solid #1e3b4f; border-radius: 20px; color: white; font-size: 14px; }

        .btn-aleatorio, .btn-pkg, .sort-btn { 
            display: inline-block; background: #ff6b35; color: #fff; text-decoration: none; 
            font-weight: bold; padding: 0 15px; border-radius: 20px; height: 40px; 
            line-height: 40px; font-size: 13px; border: 2px solid #ff6b35; 
            cursor: pointer; text-transform: uppercase; margin: 2px;
        }

        .sort-btn { background: #1e3b4f; border-color: #1e3b4f; color: #c9d9e8; }
        .sort-btn.active { background: #ff6b35; color: #0b0f17; }
        
        .stats { color: #9ab8d9; font-weight: bold; font-size: 16px; margin: 0 10px; display: inline-block; }

        /* Layout de Columnas para PS3 */
        .body-layout { width: 100%; text-align: center; }
        .sidebar-cell { display: inline-block; width: 100%; max-width: 250px; vertical-align: top; margin-bottom: 20px; }
        .content-cell { display: inline-block; width: 100%; max-width: 1400px; vertical-align: top; }

        /* Sidebar mejorado */
        .genre-sidebar { background: #0a1a2a; border-radius: 12px; border: 2px solid #1e3b4f; border-left: 5px solid #ff6b35; }
        .sidebar-title { background: #ff6b35; color: #0b0f17; font-weight: bold; font-size: 14px; padding: 10px; text-transform: uppercase; }
        .genre-list { max-height: 400px; overflow-y: auto; } /* Evita que la pagina sea eterna */
        .genre-item { display: block; width: 100%; padding: 10px; background: transparent; border: none; border-bottom: 1px solid #0f2030; color: #b0c8e0; font-size: 13px; text-align: left; cursor: pointer; }
        .genre-item.active { background: #1e3b4f; color: #ff6b35; }

        /* Grid de temas adaptable */
        .grid { text-align: center; }
        .theme-card { 
            width: 300px; /* Tamaño reducido para mejor carga */
            background: #0e1727; border-radius: 15px; overflow: hidden; 
            border: 2px solid #1f3a4c; display: inline-block; 
            vertical-align: top; margin: 8px; text-align: left; 
        }
        .preview { width: 100%; background: #000; text-align: center; border-bottom: 3px solid #ff6b35; height: 180px; line-height: 180px; overflow: hidden; }
        .preview img { max-width: 100%; max-height: 100%; }
        
        .card-info { padding: 15px; }
        .theme-name { font-weight: bold; font-size: 16px; color: #fff; height: 38px; overflow: hidden; margin-bottom: 5px; }
        .theme-genre { background: #1e3b4f; padding: 4px 10px; border-radius: 8px; font-size: 12px; color: #ffb28c; display: inline-block; border: 1px solid #ff6b35; margin-bottom: 10px; }
        .download-btn { background: #ff6b35; color: #0b0f17; text-decoration: none; font-weight: bold; padding: 10px; border-radius: 20px; text-align: center; display: block; font-size: 13px; }

        /* Paginacion */
        .pagination-container { margin: 30px 0; }
        .page-box { display: inline-block; padding: 10px 15px; background: #1e3b4f; color: #fff; margin: 3px; border-radius: 8px; border: none; cursor: pointer; }
        .page-box.active { background: #ff6b35; color: #0b0f17; }

        .footer { margin-top: 30px; border-top: 2px solid #ff6b3540; padding: 20px; color: #b0c8e0; font-size: 14px; }

        /* Media Query para pantallas cuadradas (PS3 Standard) */
        @media screen and (max-width: 800px) {
            .theme-card { width: 45%; min-width: 200px; margin: 2%; }
            .logo-img { height: 60px; }
            .sidebar-cell { max-width: 100%; }
            .preview { height: 130px; line-height: 130px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <img src="recursos/titulo.png" alt="Logo" class="logo-img" onclick="volverInicio()">
        <div class="social-container">
            <a href="https://www.youtube.com/@kizeo0/videos"><img src="recursos/yt.png" class="social-icon"></a>
            <a href="https://github.com/kizeo0"><img src="recursos/git.png" class="social-icon"></a>
        </div>
    </div>

    <div class="toolbar">
        <div class="toolbar-left">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="buscarConRetraso()">
            </div>
            <button class="btn-aleatorio" onclick="modoAleatorio()">Aleatorio</button>
            <button class="sort-btn" id="adultBtn" onclick="toggleAdulto()">+18 OFF</button>
            <span class="stats" id="stats">0</span>
            <a href="https://github.com/kizeo0/PS3-THM-KZ/releases/download/PKG/PS3.THM.KZ.pkg" class="btn-pkg">PKG</a>
        </div>
    </div>

    <div class="body-layout">
        <div class="sidebar-cell">
            <div class="genre-sidebar">
                <div class="sidebar-title">Generos</div>
                <div class="genre-list" id="genreList">
                    <div style="padding:10px; color:#5a7a90;">Cargando...</div>
                </div>
            </div>
        </div>
        <div class="content-cell">
            <div id="themeGrid" class="grid">
                <div style="padding:20px; color:#ffb28c;">Iniciando sistema...</div>
            </div>
            <div class="pagination-container" id="pagination"></div>
        </div>
    </div>

    <div class="footer">
        <div>© PS3 THM KZ | By KiZeo</div>
    </div>
</div>

<script>
    /* ── CONFIGURACION OPTIMIZADA ── */
    var JSON_URL      = 'temas_ps3_conlinks.json';
    var PAGE_SIZE     = 8;       /* Menos items por pagina = mas estabilidad en PS3 */
    var CHUNK_SIZE    = 250;     /* Procesamiento mas suave para evitar freezes */
    var IMG_PARALLEL  = 1;       /* Carga de imagenes de 1 en 1 para no saturar el bus de datos */
    var SEARCH_DELAY  = 800;

    var ADULTO_KEYS = ['adult','18+','sexy','ecchi','hentai','babes','girl','girls'];
    var G_EMPTY = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
    var BASE = 'https://raw.githubusercontent.com/kizeocloud1/Previews-compresed/main/';
    var FOLDERS = [BASE+'previews1/', BASE+'previews2/', BASE+'previews3/', BASE+'previews4/', BASE+'previews5/', BASE+'previews6/'];

    /* ── ESTADO ── */
    var allThemes = [];
    var genresCache = [];
    var filteredThemes = [];
    var currentPage = 0;
    var currentGenre = '';
    var mostrarAdulto = false;
    var imageQueue = [];
    var imgActivos = 0;

    /* DOM */
    var grid = document.getElementById('themeGrid');
    var statsDiv = document.getElementById('stats');
    var pagDiv = document.getElementById('pagination');
    var searchInput = document.getElementById('searchInput');
    var genreList = document.getElementById('genreList');

    function cargarJSON() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', JSON_URL + '?v=' + Math.random(), true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var raw = JSON.parse(xhr.responseText);
                procesarChunk(raw, 0);
            }
        };
        xhr.send();
    }

    function procesarChunk(raw, offset) {
        var fin = Math.min(offset + CHUNK_SIZE, raw.length);
        for (var i = offset; i < fin; i++) {
            var item = raw[i];
            var nombre = item.archivo.replace(/\.p3t$/i, '');
            var gen = item.genero || 'Otro';
            var isA = false;
            var lowGen = gen.toLowerCase();
            for(var k=0; k<ADULTO_KEYS.length; k++) {
                if(lowGen.indexOf(ADULTO_KEYS[k]) !== -1) { isA = true; break; }
            }

            allThemes.push({
                d: item.descarga,
                g: gen,
                n: nombre,
                nl: nombre.toLowerCase(),
                ia: isA,
                img: encodeURIComponent(nombre + '.png').replace(/'/g, '%27'),
                idx: item.preview_idx || 0
            });
        }

        if (fin < raw.length) {
            grid.innerHTML = "Cargando base: " + Math.floor((fin/raw.length)*100) + "%";
            setTimeout(function() { procesarChunk(raw, fin); }, 15);
        } else {
            raw = null;
            initApp();
        }
    }

    function initApp() {
        construirCacheGeneros();
        construirSidebar();
        aplicarFiltros();
    }

    function construirCacheGeneros() {
        var seen = {};
        genresCache = [];
        for (var i = 0; i < allThemes.length; i++) {
            var t = allThemes[i];
            if (!seen[t.g] && (!t.ia || mostrarAdulto)) {
                seen[t.g] = true;
                genresCache.push(t.g);
            }
        }
        genresCache.sort();
    }

    function construirSidebar() {
        var html = '<button class="genre-item '+(currentGenre===''?'active':'')+'" onclick="volverInicio()">TODOS</button>';
        for (var i = 0; i < genresCache.length; i++) {
            var g = genresCache[i];
            html += '<button class="genre-item '+(currentGenre===g?'active':'')+'" onclick="filtrarPorGenero(\''+g.replace(/'/g, "\\'")+'\')">'+g+'</button>';
        }
        genreList.innerHTML = html;
    }

    function aplicarFiltros() {
        var q = searchInput.value.toLowerCase();
        filteredThemes = [];
        for (var i = 0; i < allThemes.length; i++) {
            var t = allThemes[i];
            if (!mostrarAdulto && t.ia) continue;
            if (q && t.nl.indexOf(q) === -1) continue;
            if (currentGenre && t.g !== currentGenre) continue;
            filteredThemes.push(t);
        }
        currentPage = 0;
        render();
    }

    function render() {
        /* Limpieza agresiva de memoria antes de renderizar */
        imageQueue = [];
        imgActivos = 0;
        
        var start = currentPage * PAGE_SIZE;
        var end = Math.min(start + PAGE_SIZE, filteredThemes.length);
        var html = "";

        for (var i = start; i < end; i++) {
            var t = filteredThemes[i];
            var folder = FOLDERS[t.idx] || FOLDERS[0];
            var imgId = "img_" + i;
            imageQueue.push({id: imgId, src: folder + t.img});

            html += '<div class="theme-card">' +
                    '<div class="preview"><img src="'+G_EMPTY+'" id="'+imgId+'"></div>' +
                    '<div class="card-info">' +
                        '<div class="theme-name">'+t.n+'</div>' +
                        '<div class="theme-genre">'+t.g+'</div>' +
                        '<a href="'+t.d+'" class="download-btn">DESCARGAR</a>' +
                    '</div></div>';
        }

        grid.innerHTML = html || '<div style="padding:20px;">Sin resultados</div>';
        statsDiv.innerHTML = filteredThemes.length;
        dibujarPaginacion();
        setTimeout(procesarImagenes, 100);
    }

    function procesarImagenes() {
        if (imageQueue.length > 0 && imgActivos < IMG_PARALLEL) {
            var item = imageQueue.shift();
            var el = document.getElementById(item.id);
            if(!el) return procesarImagenes();
            
            imgActivos++;
            el.onload = el.onerror = function() {
                imgActivos--;
                procesarImagenes();
            };
            el.src = item.src;
        }
    }

    function dibujarPaginacion() {
        var total = Math.ceil(filteredThemes.length / PAGE_SIZE);
        if (total <= 1) { pagDiv.innerHTML = ""; return; }
        
        var html = "";
        var inicio = Math.max(0, currentPage - 2);
        var fin = Math.min(total - 1, inicio + 4);

        for (var i = inicio; i <= fin; i++) {
            html += '<button class="page-box '+(i===currentPage?'active':'')+'" onclick="irPagina('+i+')">'+(i+1)+'</button>';
        }
        pagDiv.innerHTML = html;
    }

    window.irPagina = function(p) { currentPage = p; render(); window.scrollTo(0,0); };
    
    window.buscarConRetraso = function() {
        clearTimeout(window.sT);
        window.sT = setTimeout(aplicarFiltros, SEARCH_DELAY);
    };

    window.filtrarPorGenero = function(g) { currentGenre = g; construirSidebar(); aplicarFiltros(); };
    window.volverInicio = function() { currentGenre = ''; searchInput.value = ''; construirSidebar(); aplicarFiltros(); };
    window.modoAleatorio = function() {
        filteredThemes.sort(function() { return 0.5 - Math.random(); });
        render();
    };
    window.toggleAdulto = function() {
        mostrarAdulto = !mostrarAdulto;
        var btn = document.getElementById('adultBtn');
        btn.innerHTML = mostrarAdulto ? "+18 ON" : "+18 OFF";
        btn.className = mostrarAdulto ? "sort-btn active" : "sort-btn";
        construirCacheGeneros();
        construirSidebar();
        aplicarFiltros();
    };

    /* Iniciar con delay para dejar que el navegador respire */
    setTimeout(cargarJSON, 1000);

    /* Anti-Freeze: Liberar memoria al cerrar o refrescar */
    window.onunload = function() {
        allThemes = null;
        filteredThemes = null;
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PS3 THM KZ</title>
    <script>
        /* Detección de PS3 y Optimización de Ventana */
        var isPS3 = /PS3|PlayStation 3|NetFront/i.test(navigator.userAgent);
        document.documentElement.className += (isPS3 ? " is-ps3" : " is-pc");
        if(isPS3) { window.resizeTo(screen.width, screen.height); }
    </script>
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: #0b0f17; color: #e0e5f0; font-family: Arial, sans-serif; line-height: 1.2; overflow: hidden; height: 100%; }

        /* CONTENEDORES DINÁMICOS (Adaptables a 4:3) */
        .main-wrapper { position: relative; width: 100%; height: 100%; }

        /* CABEZAL FIJO */
        .header { 
            position: fixed; top: 0; left: 0; right: 0; height: 140px;
            background: #0a1a2a; border-bottom: 5px solid #ff6b35; 
            padding: 10px 20px; z-index: 100; text-align: center;
        }
        .logo-img { height: 90px; cursor: pointer; display: inline-block; }
        
        .social-container { 
            position: absolute; right: 20px; top: 20px;
            background: #0a1a2a; padding: 5px 15px; border-radius: 60px; border: 3px solid #ff6b35; 
        }
        .social-icon { width: 45px; height: 45px; margin: 0 5px; vertical-align: middle; }

        /* TOOLBAR (Debajo del Header) */
        .toolbar { 
            position: fixed; top: 140px; left: 0; right: 0; height: 60px;
            background: #0a1a2a; padding: 10px; z-index: 90; border-bottom: 1px solid #2a3a4a;
        }

        /* SIDEBAR IZQUIERDO */
        .sidebar { 
            position: fixed; top: 200px; left: 0; bottom: 0; width: 220px;
            background: #0d1626; border-right: 2px solid #ff6b35; padding: 15px 10px;
            overflow-y: auto; z-index: 80;
        }

        /* CONTENIDO PRINCIPAL (El que se adapta al centro) */
        .content-area { 
            position: fixed; top: 200px; left: 220px; right: 0; bottom: 0;
            overflow-y: scroll; padding: 20px; z-index: 70;
        }

        /* GRID DE TEMAS */
        .grid { text-align: center; }
        .theme-card { 
            display: inline-block; width: 280px; margin: 10px; 
            background: #162235; border-radius: 12px; padding: 12px;
            vertical-align: top; border: 2px solid transparent;
        }
        .theme-card:hover { border-color: #ff6b35; }
        .theme-img { width: 100%; border-radius: 8px; cursor: pointer; background: #000; }
        .theme-title { margin-top: 10px; font-size: 15px; font-weight: bold; height: 36px; overflow: hidden; }

        /* OPTIMIZACIONES ESPECÍFICAS PARA PS3 */
        .is-ps3 * { box-shadow: none !important; text-shadow: none !important; transition: none !important; }
        .is-ps3 .theme-card { background: #1a263a; border: 1px solid #333; }
        .is-ps3 .content-area { -webkit-overflow-scrolling: touch; } /* Ayuda al scroll en NetFront */
        
        /* Ajustes para Pantalla Estándar 4:3 */
        @media (max-width: 800px) {
            .sidebar { width: 180px; }
            .content-area { left: 180px; }
            .social-container { display: none; } /* Ocultar redes en 4:3 para ganar espacio */
            .logo-img { height: 70px; }
            .header { height: 110px; }
            .toolbar { top: 110px; }
            .sidebar, .content-area { top: 170px; }
        }

        /* BOTONES Y BUSCADOR */
        .search-box { width: 250px; padding: 8px 15px; border-radius: 20px; border: 2px solid #ff6b35; background: #050a14; color: #fff; }
        .sort-btn { padding: 8px 15px; background: #162235; border: 2px solid #ff6b35; color: #fff; border-radius: 20px; cursor: pointer; margin: 0 5px; }
        .sort-btn.active { background: #ff6b35; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header">
            <img src="https://raw.githubusercontent.com/PS3-THM-KZ/MAIN/main/LOGOS/LOGOTIPO.png" class="logo-img" onclick="volverInicio()">
            <div class="social-container">
                <a href="#"><img src="https://raw.githubusercontent.com/PS3-THM-KZ/MAIN/main/RECURSOS/ICONOS/YOUTUBE.png" class="social-icon"></a>
                <a href="#"><img src="https://raw.githubusercontent.com/PS3-THM-KZ/MAIN/main/RECURSOS/ICONOS/DISCORD.png" class="social-icon"></a>
                <a href="#"><img src="https://raw.githubusercontent.com/PS3-THM-KZ/MAIN/main/RECURSOS/ICONOS/PAYPAL.png" class="social-icon"></a>
            </div>
        </div>

        <div class="toolbar">
            <input type="text" id="searchInput" class="search-box" placeholder="Buscar tema...">
            <button class="sort-btn active" id="btnRecientes" onclick="cambiarOrden('reciente')">Recientes</button>
            <button class="sort-btn" id="btnAZ" onclick="cambiarOrden('az')">A-Z</button>
            <button class="sort-btn btn-adult" id="adultBtn" onclick="toggleAdulto()">+18 OFF</button>
        </div>

        <div class="sidebar" id="sidebar">
            </div>

        <div class="content-area" id="scrollContainer">
            <div class="grid" id="themeGrid">
                </div>
        </div>
    </div>

    <script>
        var allThemes = [];
        var filteredThemes = [];
        var mostrarAdulto = false;
        var currentGenre = '';
        var ordenActual = 'reciente';
        
        // Datos de ejemplo para prueba (aquí iría tu fetch al JSON)
        function cargarDatos() {
            // Simulación de carga
            aplicarFiltros();
        }

        function aplicarFiltros() {
            var grid = document.getElementById('themeGrid');
            grid.innerHTML = ""; // Limpiar antes de cargar
            
            // Lógica de filtrado y renderizado
            // Para optimizar en PS3, solo renderizamos lo necesario
            renderizarGrid();
        }

        function renderizarGrid() {
            var grid = document.getElementById('themeGrid');
            // Usamos fragmentos para evitar reflujos de layout pesados
            var fragment = document.createDocumentFragment();
            
            // Simulación de creación de cards
            for(var i=0; i<20; i++) {
                var card = document.createElement('div');
                card.className = 'theme-card';
                card.innerHTML = '<img src="https://raw.githubusercontent.com/PS3-THM-KZ/MAIN/main/RECURSOS/ICONOS/DEFAULT.png" class="theme-img"><div class="theme-title">Tema de Ejemplo ' + i + '</div>';
                fragment.appendChild(card);
            }
            grid.appendChild(fragment);
        }

        /* LIMPIEZA AGRESIVA DE MEMORIA PARA PS3 */
        window.addEventListener('unload', function() {
            // Vaciar el DOM de forma manual ayuda a la RAM de la PS3
            var grid = document.getElementById('themeGrid');
            if (grid) {
                while (grid.firstChild) { grid.removeChild(grid.firstChild); }
            }
            var side = document.getElementById('sidebar');
            if (side) {
                while (side.firstChild) { side.removeChild(side.firstChild); }
            }
            // Anular variables grandes
            allThemes = null;
            filteredThemes = null;
        });

        // Inicialización
        cargarDatos();
    </script>
</body>
</html>
